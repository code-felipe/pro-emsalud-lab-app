spring.application.name=pro-emsalud-laboratory-api

spring.datasource.url=jdbc:mysql://localhost:3306/pro_emsalud_laboratory
spring.datasource.username=root
spring.datasource.password=sasa

backup.mysql.host=localhost
backup.mysql.port=3306
backup.mysql.database=pro_emsalud_laboratory
backup.mysql.username=root
backup.mysql.password=${spring.datasource.password}
backup.mysql.mysqldump-path=C:/Program Files/MySQL/MySQL Server 8.0/bin/mysqldump.exe


spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
