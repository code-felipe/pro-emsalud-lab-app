spring.application.name=pro-emsalud-laboratory-api

spring.datasource.url=jdbc:mysql://localhost:3306/pro_emsalud_laboratory?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=sasa

backup.mysql.host=localhost
backup.mysql.port=3306
backup.mysql.database=pro_emsalud_laboratory
backup.mysql.username=${spring.datasource.username}
backup.mysql.password=${spring.datasource.password}
backup.mysql.mysqldump-path=C:/Program Files/MySQL/MySQL Server 8.0/bin/mysqldump.exe

# Flyway manda sobre el esquema; Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#configuration to upload files on windows
app.uploads.directory=C:/ProgramData/LabApp/uploads