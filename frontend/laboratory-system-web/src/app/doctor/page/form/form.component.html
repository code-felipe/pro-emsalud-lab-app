<div class="form-page">
  <ul class="alert alert-danger list-unstyled api-error" *ngIf="apiError?.errors as errors">
    <li *ngFor="let error of errors | keyvalue">
      <b>{{ error.key }}</b
      >: {{ error.value }}
    </li>
  </ul>

  <div class="form-card">
    <!-- HEADER -->
    <div class="form-card-header">
      <div class="form-header-icon"><i class="bi bi-person-badge"></i></div>
      <div>
        <h5 class="form-title">{{ title }}</h5>
        <small class="form-subtitle">Detalle del Contacto</small>
      </div>
    </div>

    <!-- BODY -->
    <div class="form-card-body">
      <form #doctorForm="ngForm">
        <!-- TITLE -->
        <div class="form-row">
          <label class="form-label">Título</label>
          <div class="form-field">
            <select
              class="form-control form-input"
              [(ngModel)]="doctor.title"
              name="title"
              required
            >
              <option *ngFor="let t of titles" [value]="t">{{ t }}</option>
            </select>
          </div>
        </div>

        <!-- FIRST NAME -->
        <div class="form-row">
          <label class="form-label">Nombre</label>
          <div class="form-field">
            <input
              type="text"
              class="form-control form-input"
              placeholder="e.g. Juan"
              [(ngModel)]="doctor.firstName"
              name="firstName"
              required
              minlength="2"
              #firstName="ngModel"
            />

            <div
              class="validation-message"
              *ngIf="firstName.invalid && (firstName.dirty || firstName.touched)"
            >
              <div *ngIf="firstName.errors?.['required']">El nombre es requerido</div>
              <div *ngIf="firstName.errors?.['minlength']">
                El nombre debe tener al menos 2 caracteres
              </div>
            </div>
          </div>
        </div>

        <!-- LAST NAME -->
        <div class="form-row">
          <label class="form-label">Apellido</label>
          <div class="form-field">
            <input
              type="text"
              class="form-control form-input"
              placeholder="e.g. Pérez"
              [(ngModel)]="doctor.lastName"
              name="lastName"
              required
              minlength="2"
              #lastName="ngModel"
            />

            <div
              class="validation-message"
              *ngIf="lastName.invalid && (lastName.dirty || lastName.touched)"
            >
              <div *ngIf="lastName.errors?.['required']">El apellido es requerido</div>
              <div *ngIf="lastName.errors?.['minlength']">
                El apellido debe tener al menos 2 caracteres
              </div>
            </div>
          </div>
        </div>

        <hr class="form-divider" />

        <!-- ACTIONS -->
        <div class="form-actions">
          <button type="button" class="btn btn-cancel" [routerLink]="['/doctors']">Cancelar</button>

          <!-- CREATE -->
          <button
            type="submit"
            class="btn btn-primary-action"
            (click)="create()"
            *ngIf="!doctor.id; else editBlock"
            [disabled]="!doctorForm.form.valid"
          >
            <i class="ti ti-plus"></i>
            Crear
          </button>

          <!-- EDIT -->
          <ng-template #editBlock>
            <button
              type="submit"
              class="btn btn-primary-action"
              (click)="update()"
              [disabled]="!doctorForm.form.valid"
            >
              <i class="ti ti-edit"></i>
              Editar
            </button>
          </ng-template>
        </div>
      </form>
    </div>
  </div>
</div>
