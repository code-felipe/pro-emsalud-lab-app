<ul *ngIf="pages.length > 0" class="pagination">
  <!-- Visits each page backwards -->
  <li class="page-item" *ngIf="paginator.number > 0">
    <a
      class="page-link"
      [routerLink]="[route]"
      [queryParams]="{ page: paginator.number - 1 }"
      queryParamsHandling="merge"
      >&laquo;</a
    >
  </li>
  <!-- Select the first Item -->
  <li class="page-item" [ngClass]="paginator.fist ? 'disabled page-item' : 'page-item'">
    <a
      class="page-link"
      [routerLink]="[route]"
      [queryParams]="{ page: paginator.number[0] }"
      queryParamsHandling="merge"
      >First</a
    >
  </li>
  <!-- Shows all pages & disable the link on current page -->
  <li
    class="page-item"
    *ngFor="let page of pages"
    [ngClass]="page - 1 == paginator.number ? 'active' : ''"
  >
    <span class="page-link" *ngIf="page - 1 == paginator.number">{{ page }}</span>
    <a
      class="page-link"
      *ngIf="page - 1 != paginator.number"
      [routerLink]="[route]"
      [queryParams]="{ page: page - 1 }"
      queryParamsHandling="merge"
      >{{ page }}</a
    >
  </li>
  <!-- Select the last Item -->
  <li class="page-item" [ngClass]="paginator.last ? 'disabled' : ''">
    <a
      class="page-link"
      [routerLink]="[route]"
      [queryParams]="{ page: paginator.totalPages - 1 }"
      queryParamsHandling="merge"
      >Last</a
    >
  </li>
  <!-- Visits each page senquencelly-->
  <li class="page-item" *ngIf="paginator.number < paginator.totalPages - 1">
    <a
      class="page-link"
      [routerLink]="[route]"
      [queryParams]="{ page: paginator.number + 1 }"
      queryParamsHandling="merge"
      >&raquo;</a
    >
  </li>
</ul>
