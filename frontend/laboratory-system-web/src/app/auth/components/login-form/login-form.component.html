<div class="login-page">
  <div class="login-container">
    <div class="login-header">
      <div class="login-logo">+</div>
      <h1>ProemSalud</h1>
      <p>Sistema de gestión de laboratorio</p>
    </div>

    <div class="login-card">
      <h2>Iniciar sesión</h2>
      <p class="login-description">Ingresa tus credenciales para continuar.</p>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <div class="form-group">
          <label for="username">Nombre de usuario</label>
          <input
            id="username"
            name="username"
            type="text"
            [(ngModel)]="username"
            placeholder="Ingresa tu usuario"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            id="password"
            name="password"
            type="password"
            [(ngModel)]="password"
            placeholder="Ingresa tu contraseña"
            autocomplete="current-password"
            required
          />
        </div>

        <p class="error-message" *ngIf="errorMessage">
          {{ errorMessage }}
        </p>

        <button type="submit" class="login-button" [disabled]="loginForm.invalid || loading">
          {{ loading ? 'Iniciando sesión...' : 'Iniciar sesión' }}
        </button>
      </form>
    </div>

    <footer class="login-footer">ProemSalud © 2026</footer>
  </div>
</div>
