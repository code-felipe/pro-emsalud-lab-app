<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="mark">Pe</div>

    <div>
      <div class="name">Pro-Emsalud</div>
      <div class="sub">Laboratorio clínico</div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <!-- INICIO -->
    <a
      class="nav-item nav-home"
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <i class="bi bi-house-door"></i>
      Inicio
    </a>

    <!-- GENERAL -->
    <div class="nav-section-label">GENERAL</div>

    <a class="nav-item" routerLink="/patients" routerLinkActive="active">
      <i class="bi bi-people"></i>
      Pacientes
    </a>

    <a class="nav-item" routerLink="/tests" routerLinkActive="active">
      <i class="bi bi-clipboard2-pulse"></i>
      Catálogo de pruebas
    </a>

    <a class="nav-item" routerLink="/test-category-references" routerLinkActive="active">
      <i class="bi bi-tags"></i>
      Categorías
    </a>

    <a class="nav-item" routerLink="/doctors" routerLinkActive="active">
      <i class="bi bi-card-list"></i>
      Contactos
    </a>

    <a class="nav-item" routerLink="/metrics" routerLinkActive="active">
      <i class="bi bi-bar-chart-line-fill"></i>
      Métricas
    </a>

    <!-- CUENTA -->
    <div class="nav-section-label mt-3">CUENTA</div>

    <a class="nav-item" routerLink="/settings" routerLinkActive="active">
      <i class="bi bi-gear"></i>
      Configuración
    </a>
  </nav>

  <!-- LOGOUT -->
  <div class="sidebar-foot">
    <button class="nav-item logout-btn" (click)="onLogout()">
      <i class="bi bi-box-arrow-right"></i>
      Cerrar sesión
    </button>
  </div>
</aside>
