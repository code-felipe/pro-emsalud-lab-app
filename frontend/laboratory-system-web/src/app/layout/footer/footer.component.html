<footer class="app-footer">
  <span>Sistema de laboratorio Pro-emsalud &copy; {{ currentYear }}</span>
  <span class="sep">·</span>
  <span>v1.0.4</span>

  @if (latestSuccessfulBackup) {
    <span class="sep">·</span>
    <span>
      Último backup: {{ latestSuccessfulBackup.createdAt }} |
