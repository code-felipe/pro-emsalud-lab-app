<header class="topheader">
  <div class="header-brand">
    <div class="brand-mark">Pe</div>
    <span class="brand-name">Laboratorio Clínico</span>
  </div>

  <div class="header-right">
    <span class="header-datetime">
      <i class="bi bi-clock"></i>
      13 sep 2026, 2:45 PM
    </span>

    <button class="header-icon-btn" title="Notificaciones">
      <i class="bi bi-bell"></i>
    </button>

    <div class="user-menu-wrapper">
      <div class="user-chip" (click)="toggleUserMenu()">
        <div class="user-avatar">
          <img
            [src]="pictureUrl()"
            (error)="onImageError($event)"
            [alt]="'Foto de perfil de ' + (username() || 'usuario')"
            class="user-avatar-img"
          />
        </div>
        <span class="user-name">{{ username() || 'usuario' }}</span>
        <i class="bi bi-chevron-down"></i>
      </div>

      @if (isUserMenuOpen()) {
        <div class="user-dropdown">
          <div class="dropdown-header">
            <div class="dropdown-name">{{ username() || 'Usuario' }}</div>
            <div class="dropdown-email">Sesión activa</div>
          </div>

          @if (user(); as currentUser) {
            <a
              class="dropdown-item"
              [routerLink]="['/users/view', currentUser.id]"
              (click)="closeUserMenu()"
            >
              <i class="bi bi-person"></i>
              Mi perfil
            </a>
          }

          <a class="dropdown-item">
            <i class="bi bi-key"></i>
            Cambiar contraseña
          </a>

          <div class="dropdown-divider"></div>

          <button class="dropdown-item logout" (click)="onLogout()">
            <i class="bi bi-box-arrow-right"></i>
            Cerrar sesión
          </button>
        </div>
      }
    </div>
  </div>
</header>
