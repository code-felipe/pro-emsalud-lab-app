<div class="form-page">
  <ul class="alert alert-danger list-unstyled api-error" *ngIf="apiError?.errors as errors">
    <li *ngFor="let error of errors | keyvalue">
      <b>{{ error.key }}</b
      >: {{ error.value }}
    </li>
  </ul>

  <div class="form-card">
    <!-- HEADER -->
    <div class="form-card-header">
      <div class="form-header-icon">
        <i class="bi bi-measuring-cup"></i>
      </div>

      <div>
        <h5 class="form-title">
          {{ test.id != null ? 'Editar Prueba Referencial' : title }}
        </h5>

        <small class="form-subtitle"> Detalle de la Prueba </small>
      </div>
    </div>

    <!-- BODY -->
    <div class="form-card-body">
      <form #testForm="ngForm">
        <!-- NAME -->
        <div class="form-row">
          <label class="form-label" for="name">Nombre de Prueba</label>

          <div class="form-field">
            <input
              id="name"
              type="text"
              class="form-control form-input"
              placeholder="Ej. Examen general de orina"
              [(ngModel)]="test.name"
              name="name"
              required
              minlength="4"
              #name="ngModel"
            />

            <div class="validation-message" *ngIf="name.invalid && (name.dirty || name.touched)">
              <div *ngIf="name.errors?.['required']">Nombre de prueba es requerido</div>

              <div *ngIf="name.errors?.['minlength']">
                El nombre de prueba debe tener al menos 4 caracteres
              </div>
            </div>
          </div>
        </div>

        <!-- TEST METHOD -->
        <div class="form-row">
          <label class="form-label" for="testMethod">Método de prueba</label>

          <div class="form-field">
            <select
              id="testMethod"
              class="form-control form-input"
              [(ngModel)]="test.testMethod"
              name="testMethod"
              required
              #testMethod="ngModel"
            >
              <option [ngValue]="undefined">Seleccionar tipo</option>

              <option *ngFor="let type of testMethods" [ngValue]="type.value">
                {{ type.label }}
              </option>
            </select>

            <div
              class="validation-message"
              *ngIf="testMethod.invalid && (testMethod.dirty || testMethod.touched)"
            >
              <div *ngIf="testMethod.errors?.['required']">El tipo es requerido</div>
            </div>
          </div>
        </div>

        <!-- REFERENCE: CKEDITOR -->
        <div class="form-row form-row-full">
          <label class="form-label" for="reference">Referencia</label>

          <div class="form-field">
            <ckeditor
              id="reference"
              name="reference"
              [editor]="Editor"
              [config]="editorConfig"
              [(ngModel)]="test.reference"
            ></ckeditor>
          </div>
        </div>

        <!-- GROUP: TEST NAME -->
        <div class="form-row form-row-full">
          <label class="form-label" for="group">Prueba Grupal</label>

          <div class="form-field">
            <ckeditor
              id="group"
              name="group"
              [editor]="Editor"
              [config]="editorConfig"
              [(ngModel)]="test.group"
            ></ckeditor>
          </div>
        </div>

        <!-- PRICE -->
        <div class="form-row">
          <label class="form-label" for="price">Precio</label>

          <div class="form-field">
            <input
              id="price"
              type="number"
              class="form-control form-input"
              placeholder="Ej. 25.00"
              [(ngModel)]="test.price"
              name="price"
              required
              min="0"
              step="0.01"
              #price="ngModel"
            />

            <div class="validation-message" *ngIf="price.invalid && (price.dirty || price.touched)">
              <div *ngIf="price.errors?.['required']">Precio es requerido</div>

              <div *ngIf="price.errors?.['min']">El precio no debe ser negativo</div>
            </div>
          </div>
        </div>

        <!-- CATEGORY -->
        <div class="form-row">
          <label class="form-label" for="testCategoryId">Categoría de la Prueba</label>

          <div class="form-field">
            <select
              id="testCategoryId"
              class="form-control form-input"
              [(ngModel)]="test.testCategoryId"
              name="testCategoryId"
              required
              #testCategoryId="ngModel"
            >
              <option [ngValue]="0">Seleccionar categoría</option>

              <option *ngFor="let category of testCategories" [ngValue]="category.id">
                {{ category.name }}
              </option>
            </select>

            <div
              class="validation-message"
              *ngIf="testCategoryId.invalid && (testCategoryId.dirty || testCategoryId.touched)"
            >
              <div *ngIf="testCategoryId.errors?.['required']">La categoría es requerida</div>
            </div>
          </div>
        </div>

        <!-- DIVIDER -->
        <hr class="form-divider" />

        <!-- ACTIONS -->
        <div class="form-actions">
          <button type="button" class="btn btn-cancel" [routerLink]="['/tests']">Cancelar</button>

          <!-- CREATE -->
          <button
            type="submit"
            class="btn btn-primary-action"
            (click)="create()"
            *ngIf="!test.id; else editBlock"
            [disabled]="!testForm.form.valid"
          >
            <i class="ti ti-plus"></i>
            Crear
          </button>

          <!-- EDIT -->
          <ng-template #editBlock>
            <button
              type="submit"
              class="btn btn-primary-action"
              (click)="update()"
              [disabled]="!testForm.form.valid"
            >
              <i class="ti ti-edit"></i>
              Editar
            </button>
          </ng-template>
        </div>
      </form>
    </div>
  </div>
</div>
