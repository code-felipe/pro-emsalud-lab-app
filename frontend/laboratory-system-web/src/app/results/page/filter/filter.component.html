<div class="test-filter">
  <!-- Precio mínimo -->
  <div class="filter-field">
    <label for="priceMin">Precio mínimo</label>
    <input
      id="priceMin"
      type="number"
      class="filter-input"
      placeholder="Precio mínimo"
      [(ngModel)]="filter.priceMin"
      (ngModelChange)="onFilterChange()"
    />
  </div>
  <!-- Precio máximo -->
  <div class="filter-field">
    <label for="priceMax">Precio máximo</label>
    <input
      id="priceMax"
      type="number"
      class="filter-input"
      placeholder="Precio máximo"
      [(ngModel)]="filter.priceMax"
      (ngModelChange)="onFilterChange()"
    />
  </div>
  <!-- Creado desde -->
  <div class="filter-field filter-date">
    <label for="createdAtAfter">Creado desde</label>
    <input
      id="createdAtAfter"
      type="date"
      class="filter-input"
      [(ngModel)]="filter.createdAtAfter"
      (ngModelChange)="onFilterChange()"
    />
  </div>
  <!-- Creado hasta -->
  <div class="filter-field filter-date">
    <label for="createdAtBefore">Creado hasta</label>
    <input
      id="createdAtBefore"
      type="date"
      class="filter-input"
      [(ngModel)]="filter.createdAtBefore"
      (ngModelChange)="onFilterChange()"
    />
  </div>
  <!-- Actualizado desde -->
  <div class="filter-field filter-date">
    <label for="updatedAtAfter">Actualizado desde</label>
    <input
      id="updatedAtAfter"
      type="date"
      class="filter-input"
      [(ngModel)]="filter.updatedAtAfter"
      (ngModelChange)="onFilterChange()"
    />
  </div>
  <!-- Actualizado hasta -->
  <div class="filter-field filter-date">
    <label for="updatedAtBefore">Actualizado hasta</label>
    <input
      id="updatedAtBefore"
      type="date"
      class="filter-input"
      [(ngModel)]="filter.updatedAtBefore"
      (ngModelChange)="onFilterChange()"
    />
  </div>
</div>
